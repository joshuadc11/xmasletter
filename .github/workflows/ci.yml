name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20' # Or your specific Node.js version

    - name: Install dependencies
      run: npm install
      working-directory: ./my-app

    - name: Run lint
      run: npm run lint
      working-directory: ./my-app

    - name: Run build
      run: npm run build
      working-directory: ./my-app
